name: Validate localization
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:js
      - run: npm run check:locales
        env:
          LOCALE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run smoke:locales
